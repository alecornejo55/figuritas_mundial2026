<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figuritas — Lista</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header__content">
        <p class="header__eyebrow">Álbum oficial</p>
        <h1 class="header__title" id="titulo">Figuritas</h1>
        <p class="header__mundial" id="mundial"></p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="toolbar">
      <div class="toolbar__main">
        <div class="tabs" role="tablist">
          <button class="tab tab--active" data-tab="faltantes" role="tab" aria-selected="true">
            Me faltan
          </button>
          <button class="tab" data-tab="repetidas" role="tab" aria-selected="false">
            Repetidas
          </button>
          <button class="tab" data-tab="completados" role="tab" aria-selected="false">
            Equipos completados
          </button>
        </div>
        <label class="search">
          <input type="search" id="busqueda" placeholder="Buscar país, ej: ARG, México, FWC…" autocomplete="off">
        </label>
        <button type="button" class="btn-import no-print" id="btn-importar">
          Actualizar listado
        </button>
        <div class="toolbar__actions no-print">
          <button type="button" class="btn-icon btn-reparse" id="btn-reparse" title="Reprocesar listado.txt" aria-label="Reprocesar listado.txt">
            <svg class="btn-icon__svg" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
          <button type="button" class="btn-export" id="btn-exportar" title="Guardar como PDF desde el diálogo de impresión">
            Exportar PDF
          </button>
        </div>
        <input type="file" id="input-listado" accept=".txt,text/plain" hidden>
      </div>
      <div class="toolbar__sort no-print">
        <label class="sort">
          <span class="sort__label">Ordenar por</span>
          <select id="orden-criterio">
            <option value="original">Orden original</option>
            <option value="nombre">Nombre del país</option>
          </select>
        </label>
        <label class="sort">
          <span class="sort__label">Dirección</span>
          <select id="orden-direccion">
            <option value="asc">Ascendente</option>
            <option value="desc">Descendente</option>
          </select>
        </label>
      </div>
    </div>

    <main class="grid" id="grid" aria-live="polite"></main>
  </div>

  <div class="print-sheet" id="print-sheet" aria-hidden="true"></div>

  <script src="parser.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
